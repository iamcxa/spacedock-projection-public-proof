name: Free runner smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/free-runner-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Record runner evidence
        run: |
          printf 'event=%s\nref=%s\nsha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA"
